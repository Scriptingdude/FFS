<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Web Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body, html { height: 100%; display: flex; flex-direction: column; background: #111; color: #fff; }
    .bar {
      display: flex; gap: 8px; padding: 10px 12px; background: #1e1e1e;
      border-bottom: 1px solid #333; align-items: center;
    }
    button {
      background: #2c2c2e; color: #fff; border: none; border-radius: 8px;
      padding: 10px 14px; font-size: 16px; cursor: pointer;
    }
    button:active { background: #444; }
    input {
      flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid #3a3a3c;
      background: #2c2c2e; color: #fff; font-size: 16px; outline: none;
    }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <form class="bar" onsubmit="go(event)">
    <button type="button" onclick="frame.contentWindow.history.back()">←</button>
    <button type="button" onclick="frame.contentWindow.history.forward()">→</button>
    <input id="url" type="text" placeholder="Enter URL (e.g. wikipedia.org)" autocapitalize="none" autocorrect="off" />
    <button type="submit">Go</button>
  </form>
  <iframe id="frame" name="frame"></iframe>

  <script>
    const frame = document.getElementById('frame');
    const input = document.getElementById('url');
    function go(e) {
      e.preventDefault();
      let val = input.value.trim();
      if (!val) return;
      if (!val.startsWith('http://') && !val.startsWith('https://')) val = 'https://' + val;
      frame.src = '/browse?url=' + encodeURIComponent(val);
    }
  </script>
</body>
</html>
